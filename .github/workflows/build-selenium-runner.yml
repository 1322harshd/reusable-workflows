name: CI pipeline to build selenium runner custom image
on:
  push:
    - "**"
  paths:
    - selenium-runner/**
    - ./github/workflows/build-selenium-runner.yml
permissions:
    contents: read
    packages: write
jobs:
    build-and-push:
      name: Build and push Selenium Runner image_version: 
      runs-on: ubuntu-latest
      steps:
        - name: Checkout Code
          uses: actions/checkout@v6.1.0
        - name: Docker Metadata
          uses: docker/metadata-action@v6.2.0
          with:
            images: ghcr.io/${{ github.repository }}/selenium-runner
            tags: |
              type=raw,value=latest
        - name: Login to ghcr
          uses: docker/login-action@v4.6.0
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: set up Docker Buildx
          uses: docker/setup-buildx-action@v4.2.0
        - name: Build and Push Image
          uses: docker/build-push-action@v7.3.0
          with:
          context: selenium_runner
          file: selenium/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
